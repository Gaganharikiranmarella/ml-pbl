services:
  - type: web
    name: qoc-rl-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: qoc-rl-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: pip install -r requirements.txt && uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
