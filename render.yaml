services:
  - type: web
    name: qoc-rl-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: qoc-rl-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PORT
        value: "8000"
